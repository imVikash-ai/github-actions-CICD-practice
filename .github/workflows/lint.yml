# what is the goal of the owokflows
# Goal: Whenever someone is changes the code, the linter will check if the syntax, format , indentation is correct or not.
name: AutoLinter

on: 
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7

        # This step is install linting tool
      - name: Install Linter
        run: pip install ruff

        # This step is run the linter.
      - name: Check the files for the linting
        run: ruff check .
        
